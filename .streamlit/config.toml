# Theme for the portfolio: light and editorial. Warm off-white paper, near-black ink,
# soft sage accents. #8fa37a is the decorative sage (photo block, chart bars, rules);
# #5f7350 is the deeper sage used wherever text sits on or in sage, because white
# text on #8fa37a fails contrast (about 2.7:1) and passes on #5f7350 (about 5.2:1).
# The few details the theme can't express live in assets/style.css.

[theme]
base = "light"
primaryColor = "#5f7350"
backgroundColor = "#f4f3ef"
secondaryBackgroundColor = "#eae8e1"
textColor = "#1f1f1f"
linkColor = "#5f7350"
borderColor = "#d6d3c9"
greenColor = "#5f7350"
orangeColor = "#9a6b2f"

font = "Lato:https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap"
headingFont = "'Cormorant Garamond':https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap"
baseFontSize = 17
headingFontSizes = ["3.75rem", "2.5rem", "1.75rem", "1.375rem", "1.125rem", "1rem"]
headingFontWeights = [500, 500, 600, 600, 600, 600]
metricValueFontSize = "2.25rem"
linkUnderline = true

baseRadius = "small"
buttonRadius = "small"
showWidgetBorder = true
showSidebarBorder = true

chartCategoricalColors = ["#8fa37a", "#5f7350", "#b9b5a8", "#55534e"]
dataframeHeaderBackgroundColor = "#eae8e1"
dataframeBorderColor = "#d6d3c9"

[theme.sidebar]
backgroundColor = "#eae8e1"
secondaryBackgroundColor = "#f4f3ef"

[client]
toolbarMode = "viewer"
